services:
  timer_app:
    build:
      context: ./timer-app
      dockerfile: Dockerfile
    container_name: timer_app_prod
    restart: unless-stopped
    networks:
      - nginx_gateway_network

  webhook_receiver:
    build:
      context: ./webhook-receiver
      dockerfile: Dockerfile
    container_name: timermayu_webhook_receiver_prod
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATA_DIR: /data
      PANEL_USER: ${WEBHOOK_PANEL_USER:-debug}
      PANEL_PASSWORD: ${WEBHOOK_PANEL_PASSWORD:?WEBHOOK_PANEL_PASSWORD is required}
    volumes:
      - webhook_data:/data
    networks:
      - nginx_gateway_network

  # Tablero de pendientes en /pendientes/ (web) y /api/pendientes (api)
  pendientes_web:
    build:
      context: ./pendientes-web
      dockerfile: Dockerfile
    container_name: timermayu_pendientes_web_prod
    restart: unless-stopped
    networks:
      - nginx_gateway_network

  pendientes_api:
    build:
      context: ./pendientes-api
      dockerfile: Dockerfile
    container_name: timermayu_pendientes_api_prod
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATA_DIR: /data
      AUTH_USER: ${PENDIENTES_USER:-pendientes}
      # Sin contraseña el API arranca pero rechaza todo; así no tumba al resto del compose.
      AUTH_PASSWORD: ${PENDIENTES_PASSWORD:-}
    volumes:
      - pendientes_data:/data
    networks:
      - nginx_gateway_network

networks:
  nginx_gateway_network:
    external: true

volumes:
  webhook_data:
  pendientes_data:
