services:
  timer_app:
    build:
      context: ./timer-app
      dockerfile: Dockerfile
    container_name: timer_app_prod
    restart: unless-stopped
    networks:
      - nginx_gateway_network

  webhook_receiver:
    build:
      context: ./webhook-receiver
      dockerfile: Dockerfile
    container_name: timermayu_webhook_receiver_prod
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATA_DIR: /data
      PANEL_USER: ${WEBHOOK_PANEL_USER:-debug}
      PANEL_PASSWORD: ${WEBHOOK_PANEL_PASSWORD:?WEBHOOK_PANEL_PASSWORD is required}
    volumes:
      - webhook_data:/data
    networks:
      - nginx_gateway_network

  # Tablero de pendientes en /pendientes/ (web) y /api/pendientes (api)
  pendientes_web:
    build:
      context: ./pendientes-web
      dockerfile: Dockerfile
    container_name: timermayu_pendientes_web_prod
    restart: unless-stopped
    networks:
      - nginx_gateway_network

  pendientes_api:
    build:
      context: ./pendientes-api
      dockerfile: Dockerfile
    container_name: timermayu_pendientes_api_prod
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATA_DIR: /data
      AUTH_USER: ${PENDIENTES_USER:-pendientes}
      # Sin contraseña el API arranca pero rechaza todo; así no tumba al resto del compose.
      AUTH_PASSWORD: ${PENDIENTES_PASSWORD:-}
      # Quién tiene notas privadas (apuntes de cursos): correos de perfiles, separados por comas. Vacío = nadie.
      NOTAS_CORREOS: ${PENDIENTES_NOTAS_CORREOS:-}
      # Avisos por correo (lo que alguien no vio en una hora): con PENDIENTES_AVISOS_POR_CORREO=si y el SMTP puesto. Las
      # credenciales viven solo en el .env del servidor.
      AVISOS_POR_CORREO: ${PENDIENTES_AVISOS_POR_CORREO:-}
      SMTP_HOST: ${PENDIENTES_SMTP_HOST:-}
      SMTP_PORT: ${PENDIENTES_SMTP_PORT:-}
      SMTP_SECURE: ${PENDIENTES_SMTP_SECURE:-}
      SMTP_USER: ${PENDIENTES_SMTP_USER:-}
      SMTP_PASSWORD: ${PENDIENTES_SMTP_PASSWORD:-}
      MAIL_FROM: ${PENDIENTES_MAIL_FROM:-}
    volumes:
      - pendientes_data:/data
    networks:
      - nginx_gateway_network

networks:
  nginx_gateway_network:
    external: true

volumes:
  webhook_data:
  pendientes_data:
